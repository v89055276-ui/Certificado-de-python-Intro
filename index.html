
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado Oficial de Python</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101820, #172d42, #101820);
    }

    .contenedor {
      width: 100%;
      max-width: 540px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ffd343;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .descripcion {
      color: #d6e2ee;
      line-height: 1.6;
      font-size: 16px;
    }

    .aviso {
      margin: 25px 0;
      padding: 18px 12px;
      border-radius: 12px;
      background: rgba(255, 190, 0, 0.12);
      border: 1px solid #ffcc33;
      color: #ffda70;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      animation: brillo 1.5s infinite;
    }

    @keyframes brillo {
      50% {
        box-shadow: 0 0 18px rgba(255, 204, 51, 0.3);
      }
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    #recibir {
      background: #ffd343;
      color: #18212b;
    }

    #recibir:hover {
      background: #ffe477;
    }

    #estado {
      min-height: 24px;
      margin-top: 18px;
      color: #b9e5ff;
      font-size: 14px;
    }

    .pie {
      margin-top: 25px;
      color: #91a6ba;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <div class="logo">🐍</div>

    <h1>Certificado de Python</h1>

    <p class="descripcion">
      ¡Felicidades! Tu certificado de programación está listo.
      Pulsa el siguiente botón para recibirlo.
    </p>

    <div class="aviso">
      🔊 ¡POR FAVOR, SUBE EL VOLUMEN
      PARA ESCUCHAR EL VIDEO TUTORIAL! 🎧
    </div>

    <button id="recibir">
      🎓 RECIBIR CERTIFICADO
    </button>

    <p id="estado" aria-live="polite">
      Esperando para recibir tu certificado...
    </p>

    <!-- CAMBIA "gemido.mp3" POR EL NOMBRE DE TU AUDIO -->
    <audio id="sonido" preload="auto">
      <source src="gemido.mp3" type="audio/mpeg">
    </audio>

    <div class="pie">
      Plataforma de aprendizaje · Python
    </div>

  </main>

  <script>
    const boton = document.getElementById("recibir");
    const sonido = document.getElementById("sonido");
    const estado = document.getElementById("estado");

    boton.addEventListener("click", async () => {
      estado.textContent = "Preparando tu certificado...";

      try {
        sonido.currentTime = 0;
        await sonido.play();

        estado.textContent =
          "¡Tu tutorial está en reproducción! 🎧";
      } catch (error) {
        estado.textContent =
          "No se pudo reproducir el audio. Revisa el nombre y la ubicación del archivo.";
      }
    });
  </script>
</body>
</html>
